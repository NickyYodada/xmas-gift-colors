<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 聖誕節交換禮物</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; color: #3b2a2a;
    background: radial-gradient(circle at 50% 0, #1f5a3d 0, #0f3d2a 60%, #0a2a1d 100%) fixed; min-height: 100vh; }
  h1 { text-align: center; color: #fff; font-size: 30px; text-shadow: 0 2px 8px #0008; margin: 8px 0 4px; letter-spacing: 2px; }
  h1::after { content: ""; display: block; height: 6px; margin: 10px auto 0; width: 220px; border-radius: 3px;
    background: repeating-linear-gradient(45deg, #c62828 0 12px, #fff 12px 24px); }
  .rules { background: #fffaf0; border-radius: 12px; padding: 12px 20px; font-size: 14px; color: #5a3a3a; margin-top: 16px;
    border: 3px solid #c9a227; box-shadow: 0 4px 14px #0006; }
  .rules b:first-child { color: #c62828; font-size: 16px; }
  .rules ol { margin: 6px 0; padding-left: 20px; line-height: 1.8; }
  .head { display: flex; padding: 0 16px; color: #f5e6b3; font-size: 15px; margin-top: 18px; font-weight: bold; }
  .row { display: flex; align-items: center; gap: 10px; background: #fffaf0; border-radius: 12px; padding: 10px 16px; margin: 10px 0;
    border-left: 6px solid #c62828; box-shadow: 0 3px 10px #0005; }
  .row:nth-child(even) { border-left-color: #2e7d32; }
  .row { flex-wrap: nowrap; }
  .who { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px; font-size: 13px; white-space: nowrap; }
  .who b { font-size: 21px; }
  .row .chip { flex: 1; min-width: 0; }
  .say { white-space: nowrap; }
  @media (max-width: 560px) { .row { padding: 8px; gap: 4px; } .who { flex-direction: column; align-items: center; gap: 0; padding: 4px 6px; } .who b { font-size: 18px; } .say { font-size: 12px; } }
  .who { padding: 6px 10px; border-radius: 10px; }
  .angel { background: #e3f2fd; color: #1565c0; border: 2px solid #1e88e5; }
  .owner { background: #fff3e0; color: #e65100; border: 2px solid #fb8c00; }
  .who.angel b { color: #0d47a1; }
  .who.owner b { color: #bf360c; }
  .say { font-size: 14px; color: #5a3a3a; }
  .chip { min-width: 90px; text-align: center; padding: 6px 10px; border-radius: 20px; font-weight: bold; border: 2px dashed #ccc; color: #aaa; }
  button { cursor: pointer; padding: 7px 12px; border: 0; border-radius: 8px; background: #c62828; color: #fff; font-size: 14px; font-weight: bold; box-shadow: 0 2px 0 #7f1717; }
  button:hover:not(:disabled) { background: #e53935; }
  button:disabled { background: #bbb; box-shadow: none; cursor: default; }
  .reset { background: #2e7d32; box-shadow: 0 2px 0 #1b5e20; display: block; margin: 20px auto; }
  .picker { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 18px 0 6px; }
  .picker .chip { min-width: 120px; font-size: 18px; }
  .deco { position: fixed; z-index: -1; pointer-events: none; opacity: .35; filter: drop-shadow(0 2px 4px #0006); }
  .snow { position: fixed; top: -10px; color: #fff; pointer-events: none; animation: fall linear infinite; opacity: .8; }
  @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }</style>
</head>
<body>
<h1>🎄 2026 聖誕節交換禮物 🎁</h1>
<div class="rules">
  <b>🎨 遊戲規則</b>
  <ol>
    <li><b>小天使</b>：負責準備禮物的人；<b>小主人</b>：收到禮物的人。</li>
    <li>禮物主體外觀，視覺偏向該顏色即可，禮物<b>顏色占比至少要 80%</b>。</li>
    <li>預算 <b>800～1000 元</b>。</li>
    <li>禮物內容必須保密：<b>不可透露自己要送什麼，也不可詢問或要求小主人想收什麼</b>。</li>
    <li>主打「驚喜或驚嚇」，收到什麼就是什麼！</li>
  </ol>
</div>
<div id="list"></div>

<script>
const PAIRS = [
  ["忻曄","小姑姑"],["忠佑","婷婷"],["阿杏","意閑"],["意閑","忠佑"],
  ["婷婷","凱杰"],["凱杰","張昕"],["張昕","阿杏"],["陳憲","忻曄"],["小姑姑","陳憲"]
];
const COLORS = [
  ["紅色","#e53935"],["橘色","#fb8c00"],["黃色","#fdd835"],["綠色","#43a047"],
  ["藍色","#1e88e5"],["紫色","#8e24aa"],["粉紅色","#f48fb1"],["黑色","#212121"],
  ["白色","#fafafa"],["灰色","#9e9e9e"],["咖啡色","#795548"],["米色","#e8dcc2"],
  ["卡其色","#c3b091"],["駝色","#c19a6b"],["深藍色","#1a237e"],["酒紅色","#7b1e3a"],
  ["墨綠色","#1b5e20"],["薰衣草紫","#b39ddb"],["青綠色","#26a69a"],["天藍色","#4fc3f7"],
  ["霧藍色","#90a4c8"],["橘紅色","#ff5722"],["金黃色","#ffc107"],["草綠色","#8bc34a"],
  ["寶藍色","#2f5fd0"],["玫瑰紅","#d81b60"],["銀色","#c0c0c0"],["青色","#00bcd4"],
  ["淺粉色","#f8bbd0"],["栗色","#8d4a2b"]
];
const FIXED = [28,1,12,7,14,0,15,17,25];
const state = {};
PAIRS.forEach(([giver], i) => { state[giver] = FIXED[i]; });

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  PAIRS.forEach(([giver, target]) => {
    const row = document.createElement("div");
    row.className = "row";
    const c = state[giver] !== undefined ? COLORS[state[giver]] : null;
    const mk = (cls, html) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; return d; };
    const chip = document.createElement("div");
    chip.className = "chip";
    if (c) {
      chip.textContent = c[0];
      chip.style.background = c[1];
      const n = parseInt(c[1].slice(1), 16);
      const lum = ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000;
      chip.style.color = lum > 150 ? "#222" : "#fff";
    } else chip.textContent = "？";
    row.append(mk("who angel", `<span>👼 小天使</span><b>${giver}</b>`), mk("say", "請準備"), chip, mk("say", "禮物給"), mk("who owner", `<span>🏠 小主人</span><b>${target}</b>`));
    list.append(row);
  });
}

render();
for (let i = 0; i < 30; i++) {
  const f = document.createElement("div");
  f.className = "snow"; f.textContent = "❄";
  f.style.left = Math.random() * 100 + "vw";
  f.style.fontSize = 10 + Math.random() * 16 + "px";
  f.style.animationDuration = 6 + Math.random() * 8 + "s";
  f.style.animationDelay = -Math.random() * 10 + "s";
  document.body.append(f);
}
const DECO = [
  ["🎄", 6, 78, 90], ["⛄", 88, 74, 90], ["🎁", 20, 86, 56], ["🎁", 74, 88, 64], ["🎅", 46, 82, 70],
  ["🎄", 90, 8, 60], ["🔔", 4, 12, 48], ["⭐", 48, 4, 44], ["🦌", 28, 90, 60], ["🧦", 62, 6, 48],
  ["⛄", 3, 45, 64], ["🎄", 94, 42, 70], ["🍪", 56, 90, 44], ["🎁", 8, 28, 48]
];
DECO.forEach(([e, x, y, s]) => {
  const d = document.createElement("div");
  d.className = "deco"; d.textContent = e;
  d.style.left = x + "vw"; d.style.top = y + "vh"; d.style.fontSize = s + "px";
  document.body.append(d);
});</script>
</body>
</html>
